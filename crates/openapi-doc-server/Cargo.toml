[package]
name = "openapi-doc-server"
version = "0.3.0-pre0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAPI documentation server with support for multiple frontends (Scalar, Redoc)"

[[bin]]
name = "openapi-doc-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
openapi-common = { path = "../openapi-common" }

# External dependencies
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
scalar_api_reference = { version = "0.2.19", optional = true }
askama = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }

[features]
default = ["scalar"]
scalar = ["dep:scalar_api_reference"]
redoc = []
