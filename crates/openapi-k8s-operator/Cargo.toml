[package]
name = "openapi-k8s-operator"
version = "0.3.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kubernetes operator for discovering and centralizing OpenAPI documentation"

[[bin]]
name = "openapi-k8s-operator"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
openapi-common = { path = "../openapi-common" }

# External dependencies
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime", "derive"] }
kube-runtime = "4.2.0"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
